<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match the Pairs | Reproduction chez l'homme</title><link rel="icon" type="image/png" href="../assets/images/favicon.png"><link rel="stylesheet" href="../style.css">
<style>.game-wrap{max-width:900px;margin:auto}.game-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px;color:var(--muted);font-weight:700}.match-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.match-card{min-height:95px;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;border:1px solid var(--border);border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:700;cursor:pointer;transition:.2s}.match-card:hover{transform:translateY(-2px);border-color:var(--primary)}.match-card.selected{border-color:var(--primary);background:var(--primary-soft)}.match-card.matched{background:rgba(40,180,110,.14);border-color:#27a86e;cursor:default}.match-card.wrong{background:rgba(220,80,90,.14);border-color:#d95763}.game-message{margin-top:22px;padding:16px 18px;border-radius:16px;background:var(--primary-soft);text-align:center;display:none}.restart-game{display:none;margin:25px auto 0;border:0;background:var(--primary);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;cursor:pointer}@media(max-width:700px){.match-grid{grid-template-columns:1fr}}</style></head>
<body><div class="container"><nav class="navbar"><div class="logo">Yalumy<span>Hub</span></div><div class="nav-links"><a href="../index.html">Home</a><a href="../courses/index.html">Courses</a><a href="../podcasts/index.html">Podcasts</a><a href="../the-owner/index.html">The Owner</a><button class="theme-toggle" id="themeToggle">🌙</button></div></nav>
<section class="hero"><div class="hero-badge">L'HOMME • GAME</div><h1>Match the <span>pairs.</span></h1><p>Associe chaque élément du cours à sa fonction ou à sa définition correcte.</p></section>
<section class="section"><div class="game-wrap"><div class="game-top"><span id="pairsCount"></span><span id="attempts"></span></div><div class="match-grid" id="matchGrid"></div><div class="game-message" id="gameMessage"></div><button class="restart-game" id="restartGame">↻ Rejouer</button></div></section><footer>YalumyHub — Understand • Remember • Practice</footer></div>
<script>
const pairs=[
 {id:1,term:"Cellules de Leydig",definition:"Produisent la testostérone dans le tissu interstitiel."},
 {id:2,term:"Cellules de Sertoli",definition:"Soutiennent, protègent et nourrissent les cellules germinales."},
 {id:3,term:"Multiplication",definition:"Mitoses successives des spermatogonies."},
 {id:4,term:"Maturation",definition:"Méiose : division réductionnelle puis équationnelle."},
 {id:5,term:"Spermiogenèse",definition:"Différenciation des spermatides en spermatozoïdes."},
 {id:6,term:"GnRH",definition:"Hormone hypothalamique pulsatile qui stimule l'hypophyse."},
 {id:7,term:"LH",definition:"Stimule les cellules de Leydig."},
 {id:8,term:"FSH",definition:"Stimule les cellules de Sertoli."},
 {id:9,term:"Inhibine",definition:"Exerce un rétrocontrôle négatif sur la sécrétion de FSH."},
 {id:10,term:"Fonction exocrine du testicule",definition:"Production des spermatozoïdes dans les tubes séminifères."}
];
let selected=[],matched=0,tries=0;const grid=document.getElementById('matchGrid'),pc=document.getElementById('pairsCount'),at=document.getElementById('attempts'),msg=document.getElementById('gameMessage'),restart=document.getElementById('restartGame');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function build(){selected=[];matched=0;tries=0;grid.innerHTML='';pc.textContent=`0 / ${pairs.length} paires`;at.textContent='0 essais';msg.style.display='none';restart.style.display='none';const cards=[];pairs.forEach(p=>{cards.push({id:p.id,type:'term',text:p.term},{id:p.id,type:'definition',text:p.definition})});shuffle(cards).forEach(c=>{const el=document.createElement('button');el.className='match-card';el.textContent=c.text;el.dataset.id=c.id;el.dataset.type=c.type;el.onclick=()=>select(el);grid.appendChild(el)})}function select(el){if(el.classList.contains('matched')||el.classList.contains('selected')||selected.length===2)return;el.classList.add('selected');selected.push(el);if(selected.length===2){tries++;at.textContent=`${tries} essais`;check()}}function check(){const[a,b]=selected;if(a.dataset.id===b.dataset.id&&a.dataset.type!==b.dataset.type){a.classList.remove('selected');b.classList.remove('selected');a.classList.add('matched');b.classList.add('matched');selected=[];matched++;pc.textContent=`${matched} / ${pairs.length} paires`;if(matched===pairs.length){msg.textContent=`Bravo ! Tu as trouvé les ${pairs.length} paires en ${tries} essais.`;msg.style.display='block';restart.style.display='block'}}else{a.classList.add('wrong');b.classList.add('wrong');setTimeout(()=>{a.classList.remove('selected','wrong');b.classList.remove('selected','wrong');selected=[]},700)}}restart.onclick=build;const tt=document.getElementById('themeToggle');if(localStorage.getItem('yalumy-theme')==='dark'){document.body.classList.add('dark');tt.textContent='☀️'}tt.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');tt.textContent=d?'☀️':'🌙';localStorage.setItem('yalumy-theme',d?'dark':'light')};build();
</script></body></html>
