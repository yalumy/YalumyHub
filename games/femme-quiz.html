<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz | Reproduction chez la femme — Yalumy Hub</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png"><link rel="stylesheet" href="../style.css">
<style>
.quiz-container{max-width:760px;margin:auto}.quiz-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px;color:var(--muted);font-weight:700}.progress-track{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:25px}.progress-bar{height:100%;width:0;background:var(--olive);transition:.3s}.quiz-card{padding:35px;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow)}.quiz-category{display:inline-block;padding:7px 11px;background:rgba(107,109,67,.12);color:var(--olive);border-radius:999px;font-size:.75rem;font-weight:800;margin-bottom:20px}.quiz-question{font-size:clamp(1.35rem,4vw,2rem);line-height:1.4;margin-bottom:28px}.answers{display:grid;gap:12px}.answer-btn{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:16px 18px;border-radius:15px;font-size:1rem;cursor:pointer;transition:.2s}.answer-btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--olive)}.answer-btn.correct{border-color:#20a66a;background:rgba(32,166,106,.12)}.answer-btn.wrong{border-color:#e35d6a;background:rgba(227,93,106,.12)}.feedback{display:none;margin-top:24px;padding:18px;border-radius:16px;background:rgba(107,109,67,.12);line-height:1.7}.feedback strong{display:block;margin-bottom:5px}.next-question,.restart-btn{border:0;background:var(--olive);color:#fff;padding:14px;border-radius:14px;font-weight:800;cursor:pointer}.next-question{display:none;width:100%;margin-top:18px;box-shadow:0 10px 28px rgba(107,109,67,.25)}.result{display:none;text-align:center}.result-score{font-size:clamp(3rem,10vw,5rem);font-weight:900;color:var(--olive);margin:20px 0}.result p{color:var(--muted);line-height:1.7}.restart-btn{margin-top:25px;padding-inline:24px}@media(max-width:600px){.quiz-card{padding:25px 18px}.next-question{position:sticky;bottom:12px;z-index:2}}
</style>
</head>
<body><div class="container">
<nav class="navbar"><div class="logo">Yalumy <span>Hub</span></div><div class="nav-links"><a href="../index.html">Home</a><a href="../memory-map/index.html">Memory Map</a><a href="../courses/index.html">Courses</a><a href="../the-owner/index.html">The Owner</a><button class="theme-toggle" id="themeToggle">🌙</button></div></nav>
<section class="hero"><div class="hero-badge">LA FEMME • QUIZ</div><h1>Teste ta <span>compréhension.</span></h1><p>Réponds aux questions, vérifie immédiatement tes réponses et révise les notions essentielles du cycle ovarien et utérin.</p></section>
<section class="section"><div class="quiz-container">
<div id="quiz"><div class="quiz-top"><span id="questionNumber"></span><span id="scoreDisplay">Score : 0</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="quiz-card"><span class="quiz-category" id="category"></span><h2 class="quiz-question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next-question" id="nextButton">Question suivante →</button></div></div>
<div class="quiz-card result" id="result"><div class="hero-badge">QUIZ TERMINÉ</div><h2>Ton résultat</h2><div class="result-score" id="finalScore"></div><p id="resultMessage"></p><button class="restart-btn" id="restartButton">↻ Recommencer</button></div>
</div></section><footer>Yalumy Hub — Understand • Remember • Practice</footer></div>
<script>
const questions=[
{category:"CYCLE OVARIEN",question:"Quel événement caractérise l'ovulation ?",answers:["La destruction du corps jaune","La libération d'un ovocyte par le follicule mûr","Le début des règles","La nidation de l'embryon"],correct:1,explanation:"L'ovulation correspond à la libération d'un ovocyte par le follicule mûr, généralement autour du milieu d'un cycle de 28 jours."},
{category:"CYCLE OVARIEN",question:"Quelle hormone hypophysaire stimule principalement la croissance des follicules ovariens ?",answers:["La LH uniquement","La prolactine","La FSH","L'ocytocine"],correct:2,explanation:"La FSH (hormone folliculo-stimulante) participe au recrutement et à la croissance des follicules ovariens."},
{category:"CYCLE OVARIEN",question:"Quel événement hormonal déclenche directement l'ovulation ?",answers:["Une chute brutale de la progestérone","Un pic de LH","Une disparition de la FSH","Une augmentation de l'inhibine seule"],correct:1,explanation:"Le pic préovulatoire de LH déclenche l'ovulation."},
{category:"HORMONES OVARIENNES",question:"Quelle hormone est principalement sécrétée par le follicule en croissance ?",answers:["La testostérone","La progestérone uniquement","Les œstrogènes","L'hCG"],correct:2,explanation:"Le follicule ovarien en croissance sécrète notamment des œstrogènes, surtout l'estradiol."},
{category:"HORMONES OVARIENNES",question:"Après l'ovulation, le follicule rompu se transforme en :",answers:["Corps jaune","Endomètre","Hypophyse","Trompe utérine"],correct:0,explanation:"Les cellules du follicule rompu se réorganisent pour former le corps jaune, qui sécrète notamment la progestérone."},
{category:"CYCLE UTÉRIN",question:"Quelle couche de l'utérus se modifie au cours du cycle menstruel ?",answers:["Le myomètre uniquement","L'endomètre","Le périmètre uniquement","Le col osseux"],correct:1,explanation:"L'endomètre, muqueuse qui tapisse l'intérieur de l'utérus, s'épaissit et se vascularise au cours du cycle."},
{category:"CYCLE UTÉRIN",question:"Quel phénomène correspond aux menstruations ?",answers:["La libération de l'ovocyte","La desquamation d'une partie de l'endomètre","La formation du corps jaune","La fécondation"],correct:1,explanation:"En l'absence de maintien hormonal du corps jaune, une partie de l'endomètre se détache et est évacuée avec le sang menstruel."},
{category:"CYCLE UTÉRIN",question:"Quel est l'effet principal des œstrogènes sur l'endomètre pendant la phase proliférative ?",answers:["Ils provoquent immédiatement sa desquamation","Ils favorisent sa reconstruction et son épaississement","Ils arrêtent définitivement le cycle","Ils transforment l'endomètre en ovaire"],correct:1,explanation:"Les œstrogènes favorisent la prolifération et la reconstruction de l'endomètre après les menstruations."},
{category:"CYCLE UTÉRIN",question:"Quel rôle joue principalement la progestérone après l'ovulation ?",answers:["Elle prépare et maintient l'endomètre dans un état favorable à une éventuelle implantation","Elle déclenche toujours les menstruations immédiatement","Elle détruit l'ovocyte","Elle stimule directement la FSH sans rétrocontrôle"],correct:0,explanation:"Sécrétée surtout par le corps jaune, la progestérone rend l'endomètre sécrétoire et favorable à une éventuelle implantation."},
{category:"RÉGULATION HORMONALE",question:"La GnRH est sécrétée par :",answers:["L'ovaire","L'endomètre","L'hypothalamus","Le corps jaune"],correct:2,explanation:"L'hypothalamus sécrète la GnRH, qui stimule la sécrétion de FSH et de LH par l'hypophyse."},
{category:"RÉGULATION HORMONALE",question:"La FSH et la LH sont sécrétées par :",answers:["L'hypophyse antérieure","L'utérus","Le follicule ovarien","Le corps jaune"],correct:0,explanation:"La FSH et la LH sont des gonadostimulines produites par l'antéhypophyse."},
{category:"RÉGULATION HORMONALE",question:"En début de cycle, la baisse des œstrogènes et de la progestérone est liée notamment :",answers:["À la régression du corps jaune du cycle précédent","À la fécondation obligatoire","À la disparition de l'hypothalamus","À la formation de l'endomètre uniquement"],correct:0,explanation:"En l'absence de grossesse, le corps jaune régresse, entraînant une chute des hormones ovariennes."},
{category:"CYCLE MENSTRUEL",question:"Un cycle de 28 jours est souvent utilisé comme modèle. Quand l'ovulation a-t-elle lieu approximativement dans ce modèle ?",answers:["Au jour 2","Au jour 7","Autour du jour 14","Au jour 28 dans tous les cas"],correct:2,explanation:"Dans un cycle théorique de 28 jours, l'ovulation survient souvent autour du jour 14. La durée réelle et la date de l'ovulation varient selon les personnes et les cycles."},
{category:"FÉCONDATION",question:"Où la fécondation a-t-elle lieu le plus souvent chez l'être humain ?",answers:["Dans l'utérus","Dans l'ampoule de la trompe utérine","Dans le vagin","Dans l'ovaire"],correct:1,explanation:"La fécondation se produit le plus souvent dans l'ampoule de la trompe utérine."},
{category:"BILAN",question:"En l'absence de grossesse, que provoque principalement la régression du corps jaune ?",answers:["Le maintien durable d'une forte sécrétion de progestérone","La chute des hormones ovariennes, puis les menstruations","Un nouveau pic immédiat de hCG","L'arrêt permanent de la sécrétion de GnRH"],correct:1,explanation:"La régression du corps jaune fait diminuer la progestérone et les œstrogènes ; l'endomètre se désagrège en partie et les menstruations commencent."}
];
let current=0,score=0,answered=false;const qn=document.getElementById('questionNumber'),sd=document.getElementById('scoreDisplay'),pb=document.getElementById('progressBar'),cat=document.getElementById('category'),qt=document.getElementById('question'),ans=document.getElementById('answers'),fb=document.getElementById('feedback'),next=document.getElementById('nextButton'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){answered=false;const q=questions[current];qn.textContent=`Question ${current+1} / ${questions.length}`;sd.textContent=`Score : ${score}`;pb.style.width=`${(current/questions.length)*100}%`;cat.textContent=q.category;qt.textContent=q.question;ans.innerHTML='';fb.style.display='none';next.style.display='none';q.answers.forEach((a,i)=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=a;b.onclick=()=>choose(i,b);ans.appendChild(b)})}
function choose(i,b){if(answered)return;answered=true;const q=questions[current],buttons=[...ans.children];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('correct');if(i===q.correct){score++;b.classList.add('correct');fb.innerHTML='<strong>✓ Bonne réponse !</strong>'+q.explanation}else{b.classList.add('wrong');fb.innerHTML='<strong>✗ Pas tout à fait.</strong>'+q.explanation}sd.textContent=`Score : ${score}`;fb.style.display='block';next.textContent=current===questions.length-1?'Voir le résultat →':'Question suivante →';next.style.display='block';pb.style.width=`${((current+1)/questions.length)*100}%`}
next.onclick=()=>{current++;current<questions.length?render():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;const p=score/questions.length;document.getElementById('resultMessage').textContent=p>=.85?'Excellent ! Tu maîtrises très bien ces notions.':p>=.6?'Très bien ! Révise encore les points où tu as hésité.':'Reprends ton résumé puis retente le quiz.'}
document.getElementById('restartButton').onclick=()=>{current=0;score=0;quiz.style.display='block';result.style.display='none';render()};const tt=document.getElementById('themeToggle');if(localStorage.getItem('yalumy-theme')==='dark'){document.body.classList.add('dark');tt.textContent='☀️'}tt.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');tt.textContent=d?'☀️':'🌙';localStorage.setItem('yalumy-theme',d?'dark':'light')};render();
</script><script src="../assets/site.js"></script></body></html>
