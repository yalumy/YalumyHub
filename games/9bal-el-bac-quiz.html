<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz | 9bal el BAC</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../style.css">

  <style>

    .quiz-container {
      max-width: 760px;
      margin: auto;
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      color: var(--muted);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-card {
      padding: 35px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .quiz-category {
      display: inline-block;
      padding: 7px 11px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .quiz-question {
      font-size: clamp(1.4rem, 4vw, 2rem);
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;

      border: 1px solid var(--border);
      background: var(--surface-solid);
      color: var(--text);

      padding: 16px 18px;
      border-radius: 15px;

      font-size: 1rem;
      cursor: pointer;

      transition: 0.2s;
    }

    .answer-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .answer-btn.correct {
      border-color: #20a66a;
      background: rgba(32, 166, 106, 0.12);
    }

    .answer-btn.wrong {
      border-color: #e35d6a;
      background: rgba(227, 93, 106, 0.12);
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .feedback {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border-radius: 16px;
      background: var(--primary-soft);
      line-height: 1.7;
    }

    .feedback strong {
      display: block;
      margin-bottom: 5px;
    }

    .next-question {
      display: none;
      width: 100%;
      margin-top: 18px;
      border: 0;
      background: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result-score {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--primary);
      margin: 20px 0;
    }

    .result p {
      color: var(--muted);
      line-height: 1.7;
    }

    .restart-btn {
      margin-top: 25px;
      border: 0;
      background: var(--primary);
      color: white;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .quiz-card {
        padding: 25px 18px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      Yalumy<span>Hub</span>
    </div>

    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../lessons/index.html">Lessons</a>
      <a href="../lessons/9bal-el-bac.html">9bal el BAC</a>

      <button class="theme-toggle" id="themeToggle">
        🌙
      </button>
    </div>

  </nav>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-badge">
      9BAL EL BAC • QUIZ
    </div>

    <h1>
      Test your
      <span>understanding.</span>
    </h1>

    <p>
      Lis attentivement, choisis ta réponse
      et comprends immédiatement pourquoi elle est correcte.
    </p>

  </section>


  <section class="section">

    <div class="quiz-container">

      <div id="quiz">

        <div class="quiz-top">
          <span id="questionNumber"></span>
          <span id="scoreDisplay">Score : 0</span>
        </div>

        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="quiz-card">

          <span class="quiz-category" id="category"></span>

          <h2 class="quiz-question" id="question"></h2>

          <div class="answers" id="answers"></div>

          <div class="feedback" id="feedback"></div>

          <button class="next-question" id="nextButton">
            Question suivante →
          </button>

        </div>

      </div>


      <!-- RESULT -->
      <div class="quiz-card result" id="result">

        <div class="hero-badge">
          QUIZ COMPLETE
        </div>

        <h2>Ton résultat</h2>

        <div class="result-score" id="finalScore"></div>

        <p id="resultMessage"></p>

        <button class="restart-btn" id="restartButton">
          ↻ Recommencer
        </button>

      </div>

    </div>

  </section>


  <footer>
    YalumyHub — Understand • Remember • Practice
  </footer>

</div>


<script>

/* =========================
   QUIZ DATA
   ========================= */

const questions = [

  {
    category: "CHROMOSOMES",

    question:
      "Une cellule possède des chromosomes organisés en paires homologues. Comment la qualifie-t-on ?",

    answers: [
      "Haploïde",
      "Diploïde",
      "Monochromatidienne",
      "Gamétique"
    ],

    correct: 1,

    explanation:
      "Une cellule diploïde est notée 2n : chaque chromosome présente son homologue."
  },


  {
    category: "CHROMOSOMES",

    question:
      "Un chromosome constitué de deux chromatides reliées au niveau du centromère correspond à :",

    answers: [
      "Un chromosome simple",
      "Un chromosome entier",
      "Deux chromosomes homologues",
      "Un chromosome haploïde"
    ],

    correct: 1,

    explanation:
      "Dans le document, le chromosome entier possède deux chromatides, alors que le chromosome simple n'en possède qu'une."
  },


  {
    category: "MITOSE & MÉIOSE",

    question:
      "Quelle succession respecte l'ordre des phases de la mitose présenté dans le document ?",

    answers: [
      "Prophase → Métaphase → Anaphase → Télophase",
      "Métaphase → Prophase → Télophase → Anaphase",
      "Prophase → Anaphase → Métaphase → Télophase",
      "Télophase → Prophase → Métaphase → Anaphase"
    ],

    correct: 0,

    explanation:
      "Le document présente les quatre phases dans l'ordre : Prophase, Métaphase, Anaphase puis Télophase."
  },


  {
    category: "MITOSE & MÉIOSE",

    question:
      "Selon le document, dans quelle lignée cellulaire se déroule la méiose ?",

    answers: [
      "La lignée germinale",
      "Toutes les cellules du corps",
      "Uniquement les cellules nerveuses",
      "Uniquement les cellules musculaires"
    ],

    correct: 0,

    explanation:
      "Le document associe la méiose aux cellules de la lignée germinale qui donneront ensuite les gamètes."
  },


  {
    category: "HORMONES",

    question:
      "Une substance chimique est sécrétée par une glande endocrine, circule dans le sang et agit sur certaines cellules. Il s'agit de :",

    answers: [
      "Un chromosome",
      "Une hormone",
      "Un allèle",
      "Un gamète"
    ],

    correct: 1,

    explanation:
      "C'est la définition de l'hormone présentée dans le document."
  },


  {
    category: "HORMONES",

    question:
      "Pourquoi une hormone n'agit-elle pas de la même manière sur toutes les cellules ?",

    answers: [
      "Parce que seules les cellules cibles possèdent le récepteur spécifique",
      "Parce que seules les cellules cibles contiennent du sang",
      "Parce que l'hormone devient un chromosome",
      "Parce que toutes les cellules produisent la même hormone"
    ],

    correct: 0,

    explanation:
      "Le document indique que les cellules cibles possèdent des récepteurs spécifiques permettant la formation du complexe récepteur-hormone."
  },


  {
    category: "HORMONES",

    question:
      "Quelle proposition distingue correctement une glande endocrine d'une glande exocrine dans le document ?",

    answers: [
      "L'endocrine possède toujours un conduit",
      "L'exocrine libère toujours ses sécrétions directement dans le sang",
      "L'endocrine déverse sa sécrétion dans le sang alors que l'exocrine possède un conduit",
      "Il n'existe aucune différence"
    ],

    correct: 2,

    explanation:
      "Le schéma oppose la glande endocrine sans conduit, dont la sécrétion rejoint le sang, à la glande exocrine possédant un conduit."
  },


  {
    category: "GÉNÉTIQUE",

    question:
      "Deux versions différentes d'un même gène sont appelées :",

    answers: [
      "Deux phénotypes",
      "Deux allèles",
      "Deux centromères",
      "Deux gamètes"
    ],

    correct: 1,

    explanation:
      "Un allèle est une forme particulière, ou version, d'un gène."
  },


  {
    category: "GÉNÉTIQUE",

    question:
      "Un individu possède les deux allèles A et a pour un même gène. Il est :",

    answers: [
      "Homozygote",
      "Hétérozygote",
      "Haploïde",
      "Un gamète"
    ],

    correct: 1,

    explanation:
      "Lorsque les deux allèles sont différents, comme Aa, le document qualifie l'individu d'hétérozygote."
  },


  {
    category: "GÉNÉTIQUE",

    question:
      "Le locus correspond à :",

    answers: [
      "L'aspect visible d'un caractère",
      "L'emplacement précis d'un gène sur un chromosome",
      "Une forme particulière d'un gène",
      "Une cellule reproductrice"
    ],

    correct: 1,

    explanation:
      "Le document définit le locus comme l'emplacement précis d'un gène sur un chromosome."
  },


  {
    category: "MONOHYBRIDISME",

    question:
      "Un individu hétérozygote Vv forme ses gamètes. D'après la loi de pureté des gamètes présentée dans le document, chaque gamète reçoit :",

    answers: [
      "V et v ensemble",
      "Un seul des deux allèles",
      "Aucun allèle",
      "Deux copies de V obligatoirement"
    ],

    correct: 1,

    explanation:
      "Les allèles se séparent lors de la formation des gamètes : chaque gamète reçoit un seul allèle."
  },


  {
    category: "MONOHYBRIDISME",

    question:
      "On veut déterminer le génotype d'un individu présentant un phénotype dominant. Quelle méthode du document est adaptée ?",

    answers: [
      "La mitose",
      "Le test-cross",
      "L'analyse du locus uniquement",
      "La duplication de l'ADN"
    ],

    correct: 1,

    explanation:
      "Le test-cross est utilisé dans le document pour déterminer le génotype d'un individu au phénotype dominant."
  }

];


/* =========================
   QUIZ ENGINE
   ========================= */

let currentQuestion = 0;
let score = 0;
let answered = false;


const questionNumber =
  document.getElementById("questionNumber");

const scoreDisplay =
  document.getElementById("scoreDisplay");

const progressBar =
  document.getElementById("progressBar");

const category =
  document.getElementById("category");

const question =
  document.getElementById("question");

const answers =
  document.getElementById("answers");

const feedback =
  document.getElementById("feedback");

const nextButton =
  document.getElementById("nextButton");

const quiz =
  document.getElementById("quiz");

const result =
  document.getElementById("result");


function showQuestion() {

  answered = false;

  feedback.style.display = "none";
  nextButton.style.display = "none";

  answers.innerHTML = "";

  const q = questions[currentQuestion];

  questionNumber.textContent =
    "Question " +
    (currentQuestion + 1) +
    " / " +
    questions.length;

  scoreDisplay.textContent =
    "Score : " + score;

  progressBar.style.width =
    ((currentQuestion) / questions.length) * 100 + "%";

  category.textContent =
    q.category;

  question.textContent =
    q.question;


  q.answers.forEach((answer, index) => {

    const button =
      document.createElement("button");

    button.className =
      "answer-btn";

    button.textContent =
      answer;

    button.addEventListener(
      "click",
      () => selectAnswer(index, button)
    );

    answers.appendChild(button);

  });

}


function selectAnswer(index, selectedButton) {

  if (answered) return;

  answered = true;

  const q =
    questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".answer-btn");


  buttons.forEach(button => {
    button.disabled = true;
  });


  if (index === q.correct) {

    score++;

    selectedButton.classList.add("correct");

    feedback.innerHTML =
      "<strong>✓ Bonne réponse</strong>" +
      q.explanation;

  } else {

    selectedButton.classList.add("wrong");

    buttons[q.correct]
      .classList.add("correct");

    feedback.innerHTML =
      "<strong>✕ Pas tout à fait</strong>" +
      q.explanation;

  }


  scoreDisplay.textContent =
    "Score : " + score;

  feedback.style.display =
    "block";

  nextButton.style.display =
    "block";

}


nextButton.addEventListener("click", () => {

  currentQuestion++;

  if (currentQuestion < questions.length) {

    showQuestion();

  } else {

    showResult();

  }

});


function showResult() {

  quiz.style.display =
    "none";

  result.style.display =
    "block";


  document
    .getElementById("finalScore")
    .textContent =
      score + " / " + questions.length;


  const percentage =
    (score / questions.length) * 100;


  let message;


  if (percentage >= 85) {

    message =
      "Excellent travail. Les notions essentielles semblent bien maîtrisées.";

  } else if (percentage >= 60) {

    message =
      "Bon travail. Quelques notions méritent encore une petite révision.";

  } else {

    message =
      "Certaines bases ont besoin d'être revues. Retourne aux flashcards et au PDF, puis réessaie.";

  }


  document
    .getElementById("resultMessage")
    .textContent =
      message;

}


document
  .getElementById("restartButton")
  .addEventListener("click", () => {

    currentQuestion = 0;
    score = 0;

    result.style.display =
      "none";

    quiz.style.display =
      "block";

    showQuestion();

  });


showQuestion();


/* =========================
   DARK MODE
   ========================= */

const themeToggle =
  document.getElementById("themeToggle");

const savedTheme =
  localStorage.getItem("yalumy-theme");


if (savedTheme === "dark") {

  document.body.classList.add("dark");
  themeToggle.textContent = "☀️";

}


themeToggle.addEventListener("click", () => {

  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {

    themeToggle.textContent = "☀️";

    localStorage.setItem(
      "yalumy-theme",
      "dark"
    );

  } else {

    themeToggle.textContent = "🌙";

    localStorage.setItem(
      "yalumy-theme",
      "light"
    );

  }

});

</script>

</body>
</html>
