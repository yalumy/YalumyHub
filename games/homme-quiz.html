<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | Reproduction chez l'homme</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-container{max-width:760px;margin:auto}.quiz-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px;color:var(--muted);font-weight:700}.progress-track{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:25px}.progress-bar{height:100%;width:0;background:var(--olive);transition:.3s}.quiz-card{padding:35px;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow)}.quiz-category{display:inline-block;padding:7px 11px;background:rgba(107,109,67,.12);color:var(--olive);border-radius:999px;font-size:.75rem;font-weight:800;margin-bottom:20px}.quiz-question{font-size:clamp(1.35rem,4vw,2rem);line-height:1.4;margin-bottom:28px}.answers{display:grid;gap:12px}.answer-btn{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:16px 18px;border-radius:15px;font-size:1rem;cursor:pointer;transition:.2s}.answer-btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--olive)}.answer-btn.correct{border-color:#20a66a;background:rgba(32,166,106,.12)}.answer-btn.wrong{border-color:#e35d6a;background:rgba(227,93,106,.12)}.feedback{display:none;margin-top:24px;padding:18px;border-radius:16px;background:rgba(107,109,67,.12);line-height:1.7}.feedback strong{display:block;margin-bottom:5px}.next-question,.restart-btn{border:0;background:var(--olive);color:#fff;padding:14px;border-radius:14px;font-weight:800;cursor:pointer}.next-question{display:none;width:100%;margin-top:18px;box-shadow:0 10px 28px rgba(107,109,67,.25)}.next-question:hover{transform:translateY(-1px)}.result{display:none;text-align:center}.result-score{font-size:clamp(3rem,10vw,5rem);font-weight:900;color:var(--olive);margin:20px 0}.result p{color:var(--muted);line-height:1.7}.restart-btn{margin-top:25px;padding-inline:24px}@media(max-width:600px){.quiz-card{padding:25px 18px}.next-question{position:sticky;bottom:12px;z-index:2}}
  </style>
</head>
<body><div class="container">
  <nav class="navbar"><div class="logo">Yalumy<span>Hub</span></div><div class="nav-links"><a href="../index.html">Home</a><a href="../courses/index.html">Courses</a><a href="../podcasts/index.html">Podcasts</a><a href="../the-owner/index.html">The Owner</a><button class="theme-toggle" id="themeToggle">🌙</button></div></nav>
  <section class="hero"><div class="hero-badge">L'HOMME • QUIZ</div><h1>Test your <span>understanding.</span></h1><p>Réponds, vérifie immédiatement ta réponse et comprends l'explication.</p></section>
  <section class="section"><div class="quiz-container">
    <div id="quiz"><div class="quiz-top"><span id="questionNumber"></span><span id="scoreDisplay">Score : 0</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="quiz-card"><span class="quiz-category" id="category"></span><h2 class="quiz-question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next-question" id="nextButton">Question suivante →</button></div></div>
    <div class="quiz-card result" id="result"><div class="hero-badge">QUIZ COMPLETE</div><h2>Ton résultat</h2><div class="result-score" id="finalScore"></div><p id="resultMessage"></p><button class="restart-btn" id="restartButton">↻ Recommencer</button></div>
  </div></section><footer>YalumyHub — Understand • Remember • Practice</footer>
</div>
<script>
const questions=[
 {category:"STRUCTURE DU TESTICULE",question:"Où se trouvent les cellules de Leydig ?",answers:["Dans la lumière du tube séminifère","Dans le tissu interstitiel","Dans la paroi de l'hypophyse","À l'intérieur des spermatozoïdes"],correct:1,explanation:"Les cellules de Leydig se situent dans le tissu interstitiel, entre les tubes séminifères."},
 {category:"STRUCTURE DU TESTICULE",question:"Quelles cellules assurent le soutien, la protection et la nutrition des cellules germinales ?",answers:["Les cellules de Leydig","Les cellules de Sertoli","Les spermatides","Les cellules hypophysaires"],correct:1,explanation:"Les cellules de Sertoli produisent notamment l'ABP et accompagnent les cellules germinales dans les tubes séminifères."},
 {category:"SPERMATOGENÈSE",question:"Quelle est la succession correcte des phases de la spermatogenèse ?",answers:["Maturation → multiplication → accroissement → différenciation","Multiplication → accroissement → maturation → différenciation","Accroissement → différenciation → multiplication → maturation","Multiplication → maturation → accroissement → différenciation"],correct:1,explanation:"La spermatogenèse comprend successivement multiplication, accroissement, maturation (méiose) puis différenciation ou spermiogenèse."},
 {category:"SPERMATOGENÈSE",question:"La phase de multiplication repose sur :",answers:["Des mitoses successives","Une seule méiose","La sécrétion de testostérone uniquement","La fécondation"],correct:0,explanation:"Pendant la multiplication, les spermatogonies se multiplient par des mitoses successives."},
 {category:"SPERMATOGENÈSE",question:"Quel phénomène caractérise surtout la phase d'accroissement ?",answers:["Une diminution du volume cytoplasmique","Une augmentation du volume cytoplasmique","La formation immédiate de quatre spermatozoïdes","La disparition des chromosomes"],correct:1,explanation:"La cellule augmente son volume cytoplasmique et devient un spermatocyte I."},
 {category:"SPERMATOGENÈSE",question:"La maturation correspond à :",answers:["La mitose","La méiose","La spermiogenèse","L'hormonogenèse"],correct:1,explanation:"Dans le document, maturation = méiose, avec division réductionnelle puis division équationnelle."},
 {category:"SPERMATOGENÈSE",question:"La spermiogenèse transforme :",answers:["Les spermatogonies en spermatocytes I","Les spermatides en spermatozoïdes","Les cellules de Sertoli en cellules de Leydig","Les spermatozoïdes en spermatides"],correct:1,explanation:"La différenciation, appelée spermiogenèse, transforme les spermatides en spermatozoïdes."},
 {category:"CHROMOSOMES",question:"Quelle formule chromosomique correspond à une spermatogonie humaine ?",answers:["n = 23 chromosomes simples","n = 23 chromosomes entiers","2n = 46 chromosomes","2n = 23 chromosomes"],correct:2,explanation:"La spermatogonie est diploïde : 2n = 46, soit 44 autosomes + XY."},
 {category:"CHROMOSOMES",question:"Après la division réductionnelle de la méiose, un spermatocyte II possède :",answers:["2n = 46 chromosomes simples","n = 23 chromosomes entiers","n = 23 chromosomes simples","2n = 46 chromosomes entiers"],correct:1,explanation:"Le spermatocyte II est haploïde, mais ses chromosomes sont encore formés de deux chromatides : n chromosomes entiers."},
 {category:"CHROMOSOMES",question:"Un spermatozoïde humain normal contient :",answers:["44A + XY","22A + X ou 22A + Y","22A + XY","46A + X"],correct:1,explanation:"Chaque spermatozoïde est haploïde : 22 autosomes et un chromosome sexuel X ou Y."},
 {category:"RÉGULATION HORMONALE",question:"Quelle hormone hypothalamique stimule l'hypophyse ?",answers:["FSH","LH","GnRH","Inhibine"],correct:2,explanation:"La GnRH est libérée par l'hypothalamus sous forme de pulses et stimule l'hypophyse."},
 {category:"RÉGULATION HORMONALE",question:"La LH agit principalement sur :",answers:["Les cellules de Sertoli","Les cellules de Leydig","Les spermatides","L'hypothalamus"],correct:1,explanation:"La LH stimule les cellules de Leydig, responsables de la production de testostérone."},
 {category:"RÉGULATION HORMONALE",question:"La FSH agit principalement sur :",answers:["Les cellules de Sertoli","Les cellules de Leydig","Les capillaires sanguins","Les caractères sexuels secondaires"],correct:0,explanation:"La FSH stimule les cellules de Sertoli et participe ainsi au bon déroulement de la spermatogenèse."},
 {category:"RÉGULATION HORMONALE",question:"L'inhibine exerce un rétrocontrôle négatif surtout sur :",answers:["La sécrétion de FSH","La production des spermatozoïdes directement","La sécrétion de testostérone par les spermatozoïdes","La lumière du tube séminifère"],correct:0,explanation:"Produite par les cellules de Sertoli, l'inhibine freine principalement la sécrétion de FSH."},
 {category:"FONCTIONS DU TESTICULE",question:"Pourquoi le testicule est-il une glande mixte ?",answers:["Il possède deux types de chromosomes","Il assure une fonction endocrine et une fonction exocrine","Il produit uniquement la testostérone","Il dépend seulement de l'hypothalamus"],correct:1,explanation:"Sa fonction endocrine est la sécrétion de testostérone dans le sang ; sa fonction exocrine est la production de spermatozoïdes."}
];
let current=0,score=0,answered=false;const qn=document.getElementById('questionNumber'),sd=document.getElementById('scoreDisplay'),pb=document.getElementById('progressBar'),cat=document.getElementById('category'),qt=document.getElementById('question'),ans=document.getElementById('answers'),fb=document.getElementById('feedback'),next=document.getElementById('nextButton'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){answered=false;const q=questions[current];qn.textContent=`Question ${current+1} / ${questions.length}`;sd.textContent=`Score : ${score}`;pb.style.width=`${(current/questions.length)*100}%`;cat.textContent=q.category;qt.textContent=q.question;ans.innerHTML='';fb.style.display='none';next.style.display='none';q.answers.forEach((a,i)=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=a;b.onclick=()=>choose(i,b);ans.appendChild(b)})}
function choose(i,b){if(answered)return;answered=true;const q=questions[current],buttons=[...ans.children];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('correct');if(i===q.correct){score++;b.classList.add('correct');fb.innerHTML=`<strong>✓ Bonne réponse !</strong>${q.explanation}`}else{b.classList.add('wrong');fb.innerHTML=`<strong>✗ Pas tout à fait.</strong>${q.explanation}`}sd.textContent=`Score : ${score}`;fb.style.display='block';next.textContent=current===questions.length-1?'Voir le résultat →':'Question suivante →';next.style.display='block';next.focus({preventScroll:true});pb.style.width=`${((current+1)/questions.length)*100}%`}
next.onclick=()=>{current++;current<questions.length?render():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;const p=score/questions.length;document.getElementById('resultMessage').textContent=p>=.85?'Excellent ! Tu maîtrises très bien le cours.':p>=.6?'Très bien ! Révise encore les points où tu as hésité.':'Reprends le PDF tranquillement puis retente le quiz.'}
document.getElementById('restartButton').onclick=()=>{current=0;score=0;quiz.style.display='block';result.style.display='none';render()};const tt=document.getElementById('themeToggle');if(localStorage.getItem('yalumy-theme')==='dark'){document.body.classList.add('dark');tt.textContent='☀️'}tt.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');tt.textContent=d?'☀️':'🌙';localStorage.setItem('yalumy-theme',d?'dark':'light')};render();
</script></body></html>
